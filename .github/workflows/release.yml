# Builds and publishes a release when a vX.Y.Z tag is pushed.
# Order matters: push the tag first and main last. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the plugin pins this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version plugin/.claude-plugin/plugin.json)
          launcher=$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' plugin/bin/indoc)
          if [ "$manifest" != "$tag" ] || [ "$launcher" != "$tag" ]; then
            echo "tag $tag, plugin.json $manifest, plugin/bin/indoc $launcher: they must match" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          set -eu
          mkdir dist
          ldflags="-s -w -X github.com/byabasaija/indoc/internal/version.Version=${GITHUB_REF_NAME#v} -X github.com/byabasaija/indoc/internal/version.GitCommit=${GITHUB_SHA} -X github.com/byabasaija/indoc/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            exe=indoc; [ "$os" = windows ] && exe=indoc.exe
            work=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$work/$exe" ./cmd/indoc
            if [ "$os" = windows ]; then
              (cd "$work" && zip -q "$GITHUB_WORKSPACE/dist/indoc_${os}_${arch}.zip" "$exe")
            else
              tar -czf "dist/indoc_${os}_${arch}.tar.gz" -C "$work" "$exe"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
